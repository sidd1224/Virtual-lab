{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
</head>
<body>
    <div class="reset-container">
        <h2>Set a New Password</h2>

        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                
                <label for="id_new_password1">New Password:</label>
                {{ form.new_password1 }}
                
                <label for="id_new_password2">Confirm Password:</label>
                {{ form.new_password2 }}

                <button type="submit">Reset Password</button>
            </form>
        {% else %}
            <p>The password reset link is invalid, possibly because it has already been used. Please request a new one.</p>
        {% endif %}
    </div>
</body>
</html>
