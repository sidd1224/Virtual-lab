{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body>
    <h2>Forgot Password</h2>
    <p>Enter your email address and we’ll send you a link to reset your password.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.email.label_tag }}<br>
        {{ form.email }}<br><br>
        <button type="submit">Send Reset Link</button>
    </form>
</body>
</html>
